# Round-robin over every `api` replica; a replica that fails or is not ready (503) is skipped.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream earwig {
    zone earwig 64k;
    # `resolve` re-reads Docker DNS, so scaled or restarted replicas are picked up
    server api:8081 resolve max_fails=1 fail_timeout=3s;
}

server {
    listen 80;
    client_max_body_size 300m;   # uploads analysed by /api/analyze

    location / {
        proxy_pass http://earwig;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;  # first mood search / upload loads models
        add_header X-Earwig-Replica $upstream_addr always;
    }
}
