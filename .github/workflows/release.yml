name: Release binaries

# Called by create-release.yml once the tag and the GitHub Release exist.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONNX Runtime needs glibc >= 2.38: Ubuntu 24.04+ / Debian 13+
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --bin earwig --target ${{ matrix.target }}
      - name: Package
        run: |
          name=earwig-${{ inputs.tag }}-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          cp target/${{ matrix.target }}/release/earwig "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: earwig-*.tar.gz*
