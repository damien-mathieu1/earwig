[package]
name = "earwig-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Audio analysis for earwig: decoding, MIR (BPM/key), CLAP audio embeddings + zero-shot tags, text embeddings"

[dependencies]
anyhow.workspace = true
earwig-core.workspace = true
fastembed = "7.7"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"] }
lofty = "0.25"
ort = "=2.0.0-rc.15"
rayon = "1.10"
rubato = "0.16"
rustfft = "6"
stratum-dsp = "1"
symphonia = { version = "0.5", features = ["all"] }
# Opus (Ogg / WebM): symphonia has no decoder yet; bundles libopus (built with cmake)
symphonia-adapter-libopus = { version = "0.2", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[features]
default = ["opus"]
opus = ["dep:symphonia-adapter-libopus"]
