[package]
name = "earwig"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Content-based music recommendation engine: index a music folder, find similar tracks, serve a web UI"

[[bin]]
name = "earwig"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[dependencies]
anyhow.workspace = true
earwig-core.workspace = true
earwig-analysis.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
hound = "3.5"
rayon = "1.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs"] }
object_store = { version = "0.14", features = ["aws"] }
futures = "0.3"
arc-swap = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[dev-dependencies]
stratum-dsp = "1"
tower = { version = "0.5", features = ["util"] }
