[workspace]
resolver = "2"
members = ["crates/earwig-core", "crates/earwig-analysis", "crates/earwig"]

[workspace.package]
# CalVer YYYY.M.N, bumped by the Create Release workflow
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/damien-mathieu1/earwig"
keywords = ["music", "recommendation", "audio", "clap", "embeddings"]
categories = ["multimedia::audio", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
earwig-core = { path = "crates/earwig-core", version = "=0.1.0" }
earwig-analysis = { path = "crates/earwig-analysis", version = "=0.1.0" }

[profile.release]
codegen-units = 1
lto = "thin"

# DSP loops are unbearably slow unoptimised; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 3
